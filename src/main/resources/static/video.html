<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>京东10143 · 短视频</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #fff; }

  /* ---------- 竖向滑动容器：一屏一条 ---------- */
  #feed {
    height: 100%; overflow-y: scroll; scroll-snap-type: y mandatory;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  #feed::-webkit-scrollbar { display: none; }

  .slide {
    position: relative; height: 100%; width: 100%;
    scroll-snap-align: start; scroll-snap-stop: always;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #0b0f19;
  }
  .slide video, .slide .fallback {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .slide .fallback {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 35%, #1e293b, #050810 70%);
  }
  .slide .fallback img {
    width: 78%; max-width: 460px; border-radius: 24px;
    box-shadow: 0 24px 60px rgba(0,0,0,.6);
    animation: kenburns 6s ease-in-out infinite alternate;
  }
  @keyframes kenburns {
    from { transform: scale(1) translateY(0); }
    to   { transform: scale(1.12) translateY(-10px); }
  }
  .slide .shade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 55%, rgba(0,0,0,.78) 100%);
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; gap: 10px; padding: calc(12px + var(--sbh, 0px)) 14px;
    background: linear-gradient(to bottom, rgba(0,0,0,.5), rgba(0,0,0,0));
  }
  .topbar a {
    color: #fff; text-decoration: none; font-size: 14px;
    background: rgba(255,255,255,.16); padding: 6px 12px; border-radius: 20px;
    backdrop-filter: blur(6px);
  }
  .topbar .t { font-size: 16px; font-weight: 700; letter-spacing: 1px; }
  .topbar .spacer { flex: 1; }
  .topbar .who { font-size: 12px; opacity: .85; }

  /* ---------- 右侧互动按钮 ---------- */
  .rail {
    position: absolute; right: 12px; bottom: 130px; z-index: 20;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .rail .btn { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .rail .ico {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,.14); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    transition: transform .15s;
  }
  .rail .btn:active .ico { transform: scale(.88); }
  .rail .ico.liked { background: #e1251b; }
  .rail .n { font-size: 11px; margin-top: 4px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .rail .avatar { width: 46px; height: 46px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; }

  /* ---------- 底部文案 + 商品卡 ---------- */
  .meta {
    position: absolute; left: 14px; right: 86px; bottom: 30px; z-index: 20;
  }
  .meta .author { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .meta .title { font-size: 14px; line-height: 1.5; margin-bottom: 6px; }
  .meta .desc { font-size: 12.5px; opacity: .82; line-height: 1.5; margin-bottom: 8px; }
  .meta .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .meta .tags span {
    font-size: 11.5px; color: #ffd35c; background: rgba(255,211,92,.13);
    padding: 3px 9px; border-radius: 20px;
  }
  /* 视频同款商品小卡 */
  .goods-card {
    position: relative; margin-top: 12px; display: flex; align-items: center; gap: 9px;
    background: rgba(26,26,30,.72); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.14);
    padding: 6px 8px 6px 6px; border-radius: 12px; cursor: pointer; max-width: 262px;
    transition: transform .16s, background .16s;
    animation: cardIn .5s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
  .goods-card:hover { background: rgba(42,42,48,.86); transform: translateY(-1px); }
  .goods-card:active { transform: scale(.98); }
  .goods-card img { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; background: #fff; flex: none; }
  .goods-card .ginfo { flex: 1; min-width: 0; }
  .goods-card .gn { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 3px; }
  .goods-card .gp { font-size: 14px; font-weight: 700; color: #ffd35c; white-space: nowrap; }
  .goods-card .gp small { font-size: 10px; font-weight: 400; }
  .goods-card .go {
    font-size: 11px; background: linear-gradient(135deg,#f2270c,#e1251b); color: #fff;
    padding: 5px 10px; border-radius: 20px; white-space: nowrap; flex: none;
    box-shadow: 0 3px 10px rgba(225,37,27,.4);
  }
  .goods-card .badge {
    position: absolute; top: -8px; left: 6px; font-size: 9.5px; letter-spacing: .5px;
    background: linear-gradient(135deg,#ff8a00,#ff3d00); color: #fff;
    padding: 2px 7px; border-radius: 10px 10px 10px 2px; font-weight: 700;
    box-shadow: 0 2px 8px rgba(255,61,0,.45); white-space: nowrap;
  }

  /* ---------- 评论抽屉 ---------- */
  .drawer-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40;
    display: none; align-items: flex-end;
  }
  .drawer-mask.show { display: flex; }
  .drawer {
    width: 100%; max-height: 74%; background: #1a1a1e; border-radius: 16px 16px 0 0;
    display: flex; flex-direction: column; animation: up .22s ease;
  }
  @keyframes up { from { transform: translateY(60px); opacity: .4; } to { transform: none; opacity: 1; } }
  .drawer .dh {
    padding: 14px 16px; font-size: 14px; text-align: center; position: relative;
    border-bottom: 1px solid rgba(255,255,255,.08); color: #ddd;
  }
  .drawer .dh b { color: #fff; }
  .drawer .dh .x { position: absolute; right: 14px; top: 12px; font-size: 20px; cursor: pointer; color: #999; }
  .drawer .dl { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .cmt { display: flex; gap: 10px; padding: 9px 0; }
  .cmt img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; }
  .cmt .cb { flex: 1; min-width: 0; }
  .cmt .cn { font-size: 12.5px; color: #8ab4f8; margin-bottom: 3px; }
  .cmt .cc { font-size: 13.5px; line-height: 1.55; color: #eee; word-break: break-word; }
  .cmt .cf { display: flex; align-items: center; gap: 12px; margin-top: 5px; font-size: 11.5px; color: #888; }
  .cmt .cf b { cursor: pointer; }
  .cmt .cf b:hover { color: #e1251b; }
  .drawer .di { display: flex; gap: 8px; padding: 10px 14px 16px; border-top: 1px solid rgba(255,255,255,.08); }
  .drawer .di input {
    flex: 1; height: 40px; border-radius: 20px; border: none; padding: 0 14px;
    background: rgba(255,255,255,.1); color: #fff; font-size: 13.5px; outline: none;
  }
  .drawer .di button {
    height: 40px; padding: 0 18px; border-radius: 20px; border: none;
    background: #e1251b; color: #fff; font-size: 13.5px; cursor: pointer;
  }
  .drawer .di button:disabled { background: #444; color: #999; }

  /* ---------- 提示 / 空态 ---------- */
  .tip {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,.78); padding: 10px 18px; border-radius: 22px;
    font-size: 13px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .tip.show { opacity: 1; }
  .hint-swipe {
    position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
    font-size: 12px; color: rgba(255,255,255,.65); z-index: 15; text-align: center;
    animation: float 2.4s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -8px); } }
  .empty-big { color: #888; text-align: center; padding: 40px 20px; font-size: 14px; }
</style>
</head>
<body>
<script>
/* App 内 webview 通顶：把真实状态栏高度写进 CSS 变量 --sbh，
   顶栏用它补偿 padding，避免被系统状态栏压住；普通浏览器无 plus，保持 0 不变 */
(function () {
  function apply(h) { if (h) document.documentElement.style.setProperty('--sbh', h + 'px'); }
  try {
    if (window.plus && plus.navigator && plus.navigator.getStatusbarHeight) {
      apply(plus.navigator.getStatusbarHeight());
    } else {
      document.addEventListener('plusready', function () {
        try { apply(plus.navigator.getStatusbarHeight()); } catch (e) {}
      }, false);
    }
  } catch (e) {}
})();
</script>

<div id="feed"><div class="empty-big">视频加载中…</div></div>

<div class="topbar">
  <a href="/index.html">← 商城</a>
  <div class="t">短视频</div>
  <a href="/live.html" style="background:linear-gradient(135deg,#ff5a4d,#e1251b);font-weight:700">🔴 直播</a>
  <div class="spacer"></div>
  <div class="who" id="who"></div>
</div>

<div class="drawer-mask" id="drawerMask" onclick="if(event.target===this) Video.closeComments()">
  <div class="drawer">
    <div class="dh"><b id="cmtCount">0</b> 条评论 <span class="x" onclick="Video.closeComments()">×</span></div>
    <div class="dl" id="cmtList"></div>
    <div class="di">
      <input id="cmtInput" placeholder="说点什么…" maxlength="200"
             onkeydown="if(event.key==='Enter')Video.sendComment()">
      <button id="cmtSend" onclick="Video.sendComment()">发送</button>
    </div>
  </div>
</div>

<div class="tip" id="tip"></div>

<script src="/js/api.js"></script>
<!-- AI 客服悬浮窗（短视频页也能随手找客服） -->
<script src="/js/chat.js"></script>
<script src="/js/chat-widget.js"></script>
<script>
function toast(msg) {
  const el = document.getElementById('tip');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1600);
}

const Video = {
  list: [],
  active: 0,
  commentTarget: null,
  liked: new Set(),
  collected: new Set(),

  async init() {
    Video.renderWho();
    try {
      // 一次拉全量（种子 + AI 生成的都在里面）：默认 60 条，够覆盖后台所有视频
      Video.list = await API.videoFeed(60);
    } catch (e) {
      document.getElementById('feed').innerHTML =
        `<div class="empty-big">视频加载失败：${e.message}<br><br>请确认后端已启动、数据库已导入 sql/java10143-v2.sql</div>`;
      return;
    }
    if (!Video.list.length) {
      document.getElementById('feed').innerHTML = '<div class="empty-big">还没有短视频，请先导入 sql/java10143-v2.sql</div>';
      return;
    }
    Video.render();
    document.getElementById('feed').addEventListener('scroll', Video.onScroll, { passive: true });
    const first = document.querySelectorAll('.slide video')[0];
    if (first) first.play().catch(() => {});
  },

  renderWho() {
    const u = API.user();
    document.getElementById('who').textContent = u ? u.nickname : '未登录（可浏览，评论需登录）';
  },

  n(v) {
    const num = Number(v || 0);
    if (num >= 10000) return (num / 10000).toFixed(1).replace('.0', '') + 'w';
    return String(num);
  },

  /** "1.2w" / "13" 反解成数字，用于在写死的徽标上做 +1 */
  num(text) {
    const s = String(text == null ? '0' : text).trim();
    if (!s) return 0;
    if (s.endsWith('w')) {
      const f = parseFloat(s);
      return isNaN(f) ? 0 : Math.round(f * 10000);
    }
    const v = parseFloat(s);
    return isNaN(v) ? 0 : v;
  },

  render() {
    const feed = document.getElementById('feed');
    feed.innerHTML = Video.list.map((v, i) => `
      <div class="slide" data-i="${i}" data-id="${v.id}">
        ${v.url
          ? `<video src="${v.url}" loop muted playsinline preload="${i < 2 ? 'auto' : 'none'}" poster="${v.cover}"></video>`
          : `<div class="fallback"><img src="${v.cover}" alt="${v.title}"></div>`}
        <div class="shade"></div>

        <div class="rail">
          <div class="btn" onclick="Video.goUser()">
            <img class="avatar" src="${v.authorAvatar || v.goods?.picture || ''}">
          </div>
          <div class="btn" onclick="Video.like(${v.id}, this)">
            <div class="ico ${Video.liked.has(v.id) ? 'liked' : ''}">❤</div>
            <div class="n" id="like-${v.id}">${Video.n(v.likeCount)}</div>
          </div>
          <div class="btn" onclick="Video.openComments(${v.id})">
            <div class="ico">💬</div>
            <div class="n" id="cmt-${v.id}">${Video.n(v.commentCount)}</div>
          </div>
          <div class="btn" onclick="Video.share('${(v.title || '').replace(/'/g, '')}', ${v.id}, this)">
            <div class="ico">↗</div>
            <div class="n" id="shr-${v.id}">${Video.n(v.shareCount)}</div>
          </div>
          <div class="btn" onclick="Video.fav(${v.id}, this)">
            <div class="ico ${Video.collected.has(v.id) ? 'liked' : ''}" id="ico-col-${v.id}">★</div>
            <div class="n" id="col-${v.id}">${Video.n(v.collectCount)}</div>
          </div>
        </div>

        <div class="meta">
          ${String(v.url || '').indexOf('/gen') >= 0
            ? `<div style="display:inline-block;margin-bottom:6px;padding:2px 8px;border-radius:6px;background:linear-gradient(90deg,#ff2d55,#ff8a3d);color:#fff;font-size:11px;font-weight:700;letter-spacing:.5px">AI 生成</div>`
            : ''}
          <div class="author">@${v.authorName || '京东10143'}</div>
          <div class="title">${v.title || ''}</div>
          ${v.description ? `<div class="desc">${v.description}</div>` : ''}
          ${(v.tags && v.tags.length) ? `<div class="tags">${v.tags.map(t => `<span>#${t}</span>`).join('')}</div>` : ''}
          ${v.goods ? `<div class="goods-card" onclick="Video.toGoods('${v.goods.id}')">
              <div class="badge">视频同款</div>
              <img src="${v.goods.picture}" alt="">
              <div class="ginfo">
                <div class="gn">${v.goods.name}</div>
                <div class="gp"><small>￥</small>${v.goods.price}</div>
              </div>
              <div class="go">去看看</div>
            </div>` : ''}
        </div>
      </div>`).join('') +
      `<div class="hint-swipe" id="swipeHint">↕ 上下滑动切换视频</div>`;
    setTimeout(() => { const h = document.getElementById('swipeHint'); if (h) h.style.display = 'none'; }, 4000);
  },

  onScroll() {
    const feed = document.getElementById('feed');
    const idx = Math.round(feed.scrollTop / feed.clientHeight);
    if (idx === Video.active) return;
    Video.active = idx;
    document.querySelectorAll('.slide video').forEach((v, i) => {
      if (i === idx) v.play().catch(() => {});
      else { v.pause(); v.currentTime = 0; }
    });
  },

  /** 点赞：再点一下取消（开关式） */
  async like(id, el) {
    try {
      const liked = Video.liked.has(id);
      const res = liked ? await API.videoLikeCancel(id) : await API.videoLike(id);
      if (liked) Video.liked.delete(id); else Video.liked.add(id);
      const ico = el.querySelector('.ico');
      if (ico) ico.classList.toggle('liked', !liked);
      const n = document.getElementById('like-' + id);
      if (n) n.textContent = Video.n(res.likeCount);
      toast(liked ? '已取消点赞' : '已点赞');
    } catch (e) { toast(e.message); }
  },

  async share(title, id, el) {
    const text = '京东10143 短视频：' + (title || '');
    if (navigator.share) navigator.share({ title: '京东10143', text }).catch(() => {});
    else toast('分享链接已复制：' + location.href);
    // 分享数 +1
    if (id) {
      try {
        const res = await API.videoShare(id);
        const n = document.getElementById('shr-' + id);
        if (n) n.textContent = Video.n(res.shareCount);
      } catch (e) { /* 分享统计失败不打扰用户 */ }
    }
  },

  /** 收藏：再点一下取消（开关式） */
  async fav(id, el) {
    try {
      const collected = Video.collected.has(id);
      const res = collected ? await API.videoCollectCancel(id) : await API.videoCollect(id);
      if (collected) Video.collected.delete(id); else Video.collected.add(id);
      if (el) {
        const ico = el.querySelector('.ico');
        if (ico) ico.classList.toggle('liked', !collected);
      }
      const n = document.getElementById('col-' + id);
      if (n) n.textContent = Video.n(res.collectCount);
      toast(collected ? '已取消收藏' : '已收藏，可在「我的」里查看');
    } catch (e) { toast(e.message); }
  },

  goUser() { toast('点击了作者主页（演示）'); },

  /**
   * 视频同款 → 跳商品详情页
   *  index.html 是 uni-app H5 打包产物，详情页路由是 /pages/detail/detail?id=xxx
   *  用 location.href 整页跳转（而非 hash 修改），保证离开后视频能停播、内存释放
   */
  toGoods(goodsId) {
    if (!goodsId) return toast('这条视频暂未关联商品');
    Video.pauseAll();
    location.href = '/index.html#/pages/detail/detail?id=' + goodsId;
  },

  /** 跳走前把所有视频暂停，避免后台继续播放耗流量 */
  pauseAll() {
    document.querySelectorAll('.slide video').forEach(v => { try { v.pause(); } catch (e) {} });
  },

  /* ---------- 评论 ---------- */
  async openComments(videoId) {
    Video.commentTarget = videoId;
    document.getElementById('drawerMask').classList.add('show');
    const list = document.getElementById('cmtList');
    list.innerHTML = '<div class="empty-big">加载中…</div>';
    try {
      const data = await API.commentList('video', videoId);
      const me = API.user();
      document.getElementById('cmtCount').textContent = data.length;
      // 评论数徽标与数据库条数保持一致（评论 / 删除后都走这里同步）
      const badge = document.getElementById('cmt-' + videoId);
      if (badge) badge.textContent = Video.n(data.length);
      list.innerHTML = data.length ? data.map(c => `
        <div class="cmt">
          <img src="${c.avatar || ''}">
          <div class="cb">
            <div class="cn">${c.nickname || '京东用户'}</div>
            <div class="cc">${c.content || ''}</div>
            <div class="cf">
              <span>${c.createTime || ''}</span>
              <b onclick="Video.likeComment(${c.id}, this)">赞 ${c.likeCount || 0}</b>
              ${(me && String(c.userId) === String(me.id)) || (me && me.admin)
                ? `<b style="color:#e1251b" onclick="Video.delComment(${c.id})">删除</b>` : ''}
            </div>
          </div>
        </div>`).join('')
        : '<div class="empty-big">还没有评论，来抢沙发～</div>';
    } catch (e) {
      list.innerHTML = `<div class="empty-big">${e.message}</div>`;
    }
  },

  closeComments() {
    document.getElementById('drawerMask').classList.remove('show');
  },

  async sendComment() {
    if (!API.token()) return toast('请先回到商城页登录');
    const input = document.getElementById('cmtInput');
    const text = input.value.trim();
    if (!text) return toast('说点什么吧');
    const btn = document.getElementById('cmtSend');
    btn.disabled = true;
    try {
      await API.commentAdd('video', Video.commentTarget, text, 5);
      input.value = '';
      toast('评论成功');
      // 评论数立即 +1；紧接着 openComments 会按数据库实际条数再校一次
      const badge = document.getElementById('cmt-' + Video.commentTarget);
      if (badge) badge.textContent = Video.n(Video.num(badge.textContent) + 1);
      Video.openComments(Video.commentTarget);
    } catch (e) { toast(e.message); }
    btn.disabled = false;
  },

  async delComment(id) {
    if (!confirm('确定删除这条评论吗？')) return;
    try {
      await API.commentDelete(id);
      toast('已删除');
      Video.openComments(Video.commentTarget);
    } catch (e) { toast(e.message); }
  },

  async likeComment(id, el) {
    try {
      const res = await API.commentLike(id);
      el.textContent = '赞 ' + res.likeCount;
    } catch (e) { toast(e.message); }
  }
};

window.Video = Video;
Video.init();
window.addEventListener('keydown', e => {
  const feed = document.getElementById('feed');
  if (e.key === 'ArrowDown') feed.scrollBy({ top: feed.clientHeight, behavior: 'smooth' });
  if (e.key === 'ArrowUp') feed.scrollBy({ top: -feed.clientHeight, behavior: 'smooth' });
});
</script>
</body>
</html>

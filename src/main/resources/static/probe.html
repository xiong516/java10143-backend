<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>probe</title></head>
<body style="margin:0">
<iframe id="f" src="/#/pages/category/category" style="width:390px;height:500px;border:1px solid #ccc"></iframe>
<pre id="out" style="font-size:12px;padding:8px;white-space:pre-wrap;background:#fffbe6"></pre>
<script>
document.getElementById('f').onload = function () {
  setTimeout(function () {
    try {
      var d = document.getElementById('f').contentDocument;
      var lines = [];
      lines.push('doc scrollWidth=' + d.documentElement.scrollWidth + ' clientWidth=' + d.documentElement.clientWidth);
      lines.push('body scrollWidth=' + d.body.scrollWidth);
      var all = d.querySelectorAll('*');
      var wide = [];
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        var r = el.getBoundingClientRect();
        if (r.width > 391 || r.right > 391) {
          wide.push(el.tagName + '.' + (el.className && el.className.baseVal !== undefined ? '' : el.className) + ' w=' + Math.round(r.width) + ' right=' + Math.round(r.right));
        }
        if (wide.length > 25) break;
      }
      lines = lines.concat(wide);
      document.getElementById('out').textContent = lines.join('\n');
    } catch (e) {
      document.getElementById('out').textContent = 'ERR ' + e.message;
    }
  }, 4000);
};
</script>
</body>
</html>
